<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Book Donation Registration</h1>
    <hr>
    <form>
        <fieldset>
            <legend>Book Details</legend>
            <label>Name</label><br>
            <input type="text" placeholder="Name"><br><br>
            <label>Grade/Email</label><br>
            <input type="grade/email" placeholder="Grade/Email"><br><br>
            <label>Genre</label><br>
            <select id="Genre">
                <option value="">-- Select the Genre of the book --</option>
                <option value="Science">Science</option>
                <option value="Fiction">Fiction</option>
                <option value="Legend">Legend</option>
            </select>
            <br><br>
            <label>Condition</label><br>
            <select id="Condition">
                <option value="">-- Select the condition of the book --</option>
                <option value="Good">Good</option>
                <option value="Bad">Bad</option>
                <option value="Torn">Torn</option>
                <option value="New">New</option>
                <option value="Old">Old</option>
            </select><br><br>
        </fieldset>
        <br>
        <input type="Submit" value="Enter my book details">
    </form>

</body>

</html>
